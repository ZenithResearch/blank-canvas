name: Notarized macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/blank-canvas.p12"
          keychain_path="$RUNNER_TEMP/blank-canvas-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Store Apple notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials blank-canvas-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"

      - name: Test
        run: swift test

      - name: Build, sign, notarize and staple
        env:
          BLANK_CANVAS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          BLANK_CANVAS_NOTARY_PROFILE: blank-canvas-notary
        run: |
          zsh scripts/build-app.sh
          zsh scripts/build-staging-app.sh

      - name: Upload renderer-only distributions
        uses: actions/upload-artifact@v4
        with:
          name: blank-canvas-2.0.0-macOS
          path: dist/*.zip
          if-no-files-found: error

